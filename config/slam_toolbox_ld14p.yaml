# slam_toolbox (online async) parameters for a hand-carried LD14P / LD19P.
#
# There is no odometry: slam_ld14p.launch.py publishes a static identity
# odom -> base_link transform and slam_toolbox gets all motion from scan
# matching. Two consequences for the parameters below:
#   * minimum_travel_distance / minimum_travel_heading must be 0, otherwise the
#     "has the robot moved enough" test, which looks at the (static) odom pose,
#     would reject every scan after the first one.
#   * minimum_time_interval is what actually paces scan processing instead.
#     It is 0: every scan is matched, so each match only has to bridge 0.1 s of
#     motion.
# The scan matcher searches +-correlation_search_space_dimension/2 metres and
# +-coarse_search_angle_offset radians around the previous pose, so move at a
# slow walking pace and turn slowly.
#
# Tuned by replaying a recorded walk (three rooms and a hall) through
# slam_toolbox with different settings. By far the largest effect was not a
# parameter here but blanking the carrier's body out of the scan, which
# slam_ld14p.launch.py does (body_crop). With that, every scan + the narrower
# window below gave the cleanest maps, consistently over repeated replays.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.15        # must be above the driver range_min (0.1) or slam_toolbox warns
    max_laser_range: 12.0        # LIDAR_RANGE_MAX in the driver
    minimum_time_interval: 0.0   # match every scan (the lidar publishes 10/s)
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.0  # see header comment
    minimum_travel_heading: 0.0   # see header comment
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Search window per processed scan (+-0.2 m, +-15 deg). With every scan
    # matched that covers a brisk walk and a fast turn, and in repeated replays
    # it gave cleaner maps than the wider 0.6 m / +-30 deg window.
    correlation_search_space_dimension: 0.4
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.262
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
